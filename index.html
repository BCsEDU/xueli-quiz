<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>學力檢測歷屆試題練習</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header><h1>📝 學力檢測歷屆試題練習</h1><a href="teacher.html">教師後台 →</a></header>

<section id="start" class="card">
  <label>年級</label>
  <select id="grade"><option value="3">三年級</option><option value="4" disabled>四年級（即將開放）</option></select>
  <label>科目</label>
  <select id="subject"><option value="chinese">國語</option><option value="math">數學</option></select>
  <label>歷屆年份</label>
  <select id="year"></select>
  <div class="row">
    <div><label>班級</label><select id="cls"></select></div>
    <div><label>座號</label><select id="seat"></select></div>
  </div>
  <p id="err" style="color:#e74c3c"></p>
  <button id="go">開始測驗</button>
</section>

<section id="exam" class="hidden">
  <div id="left">
    <div id="zoombar">
      <button id="zout" class="sec" aria-label="縮小">－</button>
      <span id="zval">100%</span>
      <button id="zin" class="sec" aria-label="放大">＋</button>
      <button id="zfit" class="sec">符合寬度</button>
      <small>只有題目框會縮放，右邊選項固定不動</small>
    </div>
    <div id="pane"><div id="pages"></div></div>
  </div>
  <aside id="sheet">
    <button id="back" class="sec" style="margin-bottom:10px">← 返回選單（答案會保留）</button>
    <div id="info" style="font-weight:600;margin-bottom:8px"></div>
    <div id="result" class="hidden"></div>
    <div id="qs"></div>
    <button id="submit" style="margin-top:12px">送出答案</button>
    <button id="again" class="sec hidden" style="margin-top:12px">再測一次</button>
  </aside>
</section>
<script src="js/config.js?v=13"></script>
<script type="module" src="js/student.js?v=13"></script>
</body></html>
