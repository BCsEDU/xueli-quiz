<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>教師後台</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header><h1>👩‍🏫 教師後台</h1><a href="index.html">← 學生測驗</a></header>
<section id="login" class="card">
  <form id="lf" autocomplete="off">
  <label>教師密碼</label><input id="pw" type="password" autocomplete="current-password">
  <p id="err" style="color:#e74c3c"></p><button id="ok" type="submit">登入</button>
  </form>
  <p id="modeNote" style="font-size:13px;color:#888"></p>
</section>
<div id="main" class="wrap hidden">
  <div class="filters">
    <select id="fExam"></select><select id="fCls"></select>
    <button class="sec" id="reload" style="width:auto">重新整理</button>
    <label style="display:flex;align-items:center;gap:6px;margin:0;font-weight:400"><input type="checkbox" id="auto" checked style="width:auto">即時更新（每 5 秒）</label><span id="upd" style="color:#888;font-size:13px"></span>
    <button class="sec" id="csv" style="width:auto">匯出 CSV</button>
  </div>
  <div class="stats" id="stats"></div>
  <h3>各題答對率（由低到高）</h3><table id="qt"></table>
  <h3>各班平均</h3><table id="ct"></table>
  <h3>學生成績與錯誤題目</h3><table id="st"></table>
</div>
<script src="js/config.js?v=13"></script>
<script type="module" src="js/teacher.js?v=13"></script>
</body></html>
